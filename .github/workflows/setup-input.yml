name: Setup input

on:
  push:
    paths:
      - 'scripts/configure_korean_law.py'
      - 'scripts/configure_credentials.py'
      - 'scripts/credential_dialog.py'
      - 'tests/configure_credentials_test.py'
      - 'credentials-setup.cmd'
      - 'credentials-setup.command'
      - 'install.sh'
      - 'toolkit/law-forms/install.sh'
      - 'tests/installer_credentials_ui_test.sh'
      - 'tests/install_open_url_test.sh'
      - 'tests/configure_korean_law_test.py'
      - 'korean-law-setup.cmd'
      - 'tests/korean_law_setup_launcher_test.ps1'
      - '.github/workflows/setup-input.yml'
  pull_request:
    paths:
      - 'scripts/configure_korean_law.py'
      - 'scripts/configure_credentials.py'
      - 'scripts/credential_dialog.py'
      - 'tests/configure_credentials_test.py'
      - 'credentials-setup.cmd'
      - 'credentials-setup.command'
      - 'install.sh'
      - 'toolkit/law-forms/install.sh'
      - 'tests/installer_credentials_ui_test.sh'
      - 'tests/install_open_url_test.sh'
      - 'tests/configure_korean_law_test.py'
      - 'korean-law-setup.cmd'
      - 'tests/korean_law_setup_launcher_test.ps1'
      - '.github/workflows/setup-input.yml'

permissions:
  contents: read

jobs:
  input:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Allow long paths on Windows runner
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check secret transport and error handling with synthetic values
        run: |
          python tests/configure_korean_law_test.py
          python tests/configure_credentials_test.py
      - name: Check installer UI handoffs
        shell: bash
        run: |
          bash tests/installer_credentials_ui_test.sh
          bash tests/install_open_url_test.sh
      - name: Lint installer scripts
        if: runner.os == 'Linux'
        run: shellcheck --severity=error install.sh toolkit/law-forms/install.sh toolkit/case-records/install.sh credentials-setup.command tests/installer_credentials_ui_test.sh
      - name: Check Windows launcher with fake Python
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/korean_law_setup_launcher_test.ps1
